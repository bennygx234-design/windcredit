name: WindCredit
options:
  bundleIdPrefix: com.bennygober
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  WindCredit:
    type: application
    platform: iOS
    sources:
      - WindCredit
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: WindCredit/WindCredit.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: WindCredit/Info.plist
      properties:
        CFBundleDisplayName: WindCredit
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [WCDisplay-SemiBold.ttf, WCDisplay-Regular.ttf, WCText-Regular.ttf, WCText-Medium.ttf, WCText-SemiBold.ttf, WCText-Bold.ttf]
        NSCameraUsageDescription: WindCredit uses the camera to scan your insurance declarations page. The photo is read on your phone and never uploaded.
        NSPhotoLibraryUsageDescription: Pick a photo of your insurance declarations page. It's read on your phone and never uploaded.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennygober.windcredit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  WindCreditTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WindCreditTests
    dependencies:
      - target: WindCredit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WindCredit:
    build:
      targets:
        WindCredit: all
        WindCreditTests: [test]
    test:
      targets: [WindCreditTests]
